name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels: ["type: feature", "status: triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What project-scoped knowledge workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Scope and safety boundaries
      description: Explain source mutation, project scope, determinism, or compatibility implications.
    validations:
      required: true
