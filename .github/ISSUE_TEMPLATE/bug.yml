name: Bug report
description: Report a reproducible Knotdown defect
title: "[Bug]: "
labels: ["type: bug", "status: triage"]
body:
  - type: markdown
    attributes:
      value: "Do not paste private vault contents or security vulnerabilities here."
  - type: input
    id: version
    attributes:
      label: Knotdown version
      placeholder: 0.1.0-alpha.1
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options: [CLI, Compiler, Obsidian preset, Knowledge Browser, MCP, Static site, Packaging]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include commands and a synthetic project tree.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and diagnostics
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, personal paths, and private note contents.
          required: true
