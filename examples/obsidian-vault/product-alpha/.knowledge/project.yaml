spec: "0.1"

project:
  id: "019ffb10-2233-7444-8555-66778899aabb"
  slug: "product-alpha"
  title: "Product Alpha Notes"
  language: "en"

content:
  roots:
    - "."
  include:
    - "**/*.md"
  exclude:
    - ".knowledge/**"
  dialect: "obsidian"

identity:
  strategy: "uuidv7"
  require_document_id: false

imports:
  allow_outside_project: false
  allow_symlink_escape: false
  warn_unused: true

mentions:
  enabled: false
  mode: "imported-labels"
  strength: "weak"
  mutate_source: false

retrieval:
  default_depth: 2
  max_depth: 3
  default_token_budget: 6000
  max_documents: 16
  semantic_search: "optional"

build:
  output: ".knowledge/dist"
  emit:
    - "markdown"
    - "json"
    - "graph"
    - "site"
    - "llms-txt"

server:
  host: "127.0.0.1"
  port: 4317
